[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "self-curate"
version = "0.16.0"
description = "Model-driven, feedback-guided data curation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
training = ["torch>=2.1"]
valuation = ["numpy>=1.24", "torch>=2.1"]
signals = ["numpy>=1.24"]
server = ["numpy>=1.24", "torch>=2.1", "transformers>=5", "peft>=0.17", "accelerate==1.15.0", "nvidia-ml-py>=12", "mini-swe-agent>=2", "pyarrow>=15", "huggingface_hub>=0.35", "docker>=7", "PyYAML>=6", "vllm>=0.11"]
# Official graders/Harbor may use separately locked server environments.

[project.scripts]
self-curate = "self_curate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

